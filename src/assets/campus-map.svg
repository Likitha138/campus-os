<svg width="1200" height="720" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0c2430"/>
    <stop offset="50%" stop-color="#102d26"/>
    <stop offset="100%" stop-color="#071821"/>
  </linearGradient>

  <linearGradient id="building" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#5c6870"/>
    <stop offset="100%" stop-color="#29343b"/>
  </linearGradient>

  <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#9ca8ad"/>
    <stop offset="100%" stop-color="#59666e"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="12"/>
  </filter>

</defs>

<!-- Ground -->
<rect width="1200" height="720" fill="url(#ground)"/>

<!-- Trees -->
<g opacity="0.65">

<circle cx="90" cy="120" r="35" fill="#173d2c"/>
<circle cx="150" cy="90" r="28" fill="#1c4933"/>
<circle cx="1020" cy="100" r="38" fill="#173d2c"/>
<circle cx="1110" cy="170" r="30" fill="#1c4933"/>
<circle cx="90" cy="600" r="45" fill="#153a2a"/>
<circle cx="1120" cy="610" r="50" fill="#163b2b"/>

</g>

<!-- Road network -->
<g
  stroke="#697875"
  stroke-width="8"
  stroke-dasharray="15 10"
  fill="none"
  opacity="0.7"
>

<path d="M80 220 L420 360 L740 250 L1100 400"/>
<path d="M130 520 L420 360 L700 520 L1080 350"/>
<path d="M420 100 L420 360 L700 520"/>
<path d="M740 250 L700 520"/>

</g>

<!-- Road glow -->
<g
  stroke="#4fa5d9"
  stroke-width="2"
  stroke-dasharray="10 14"
  fill="none"
  opacity="0.7"
>

<path d="M80 220 L420 360 L740 250 L1100 400"/>
<path d="M130 520 L420 360 L700 520 L1080 350"/>

</g>

<!-- LIBRARY -->
<g>

<polygon
points="460,80 610,105 590,215 440,190"
fill="url(#roof)"
stroke="#b9c8cc"
stroke-width="3"
/>

<polygon
points="440,190 590,215 570,280 425,255"
fill="url(#building)"
/>

<line x1="460" y1="120" x2="590" y2="140"
stroke="#75c7ed"
stroke-width="3"
opacity=".6"/>

<text
x="510"
y="70"
fill="white"
font-size="18"
font-family="Arial"
font-weight="bold"
text-anchor="middle">
LIBRARY
</text>

</g>

<!-- AUDITORIUM -->
<g>

<polygon
points="790,115 930,135 915,245 775,225"
fill="url(#roof)"
